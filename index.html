   <title>ReGAIN</title>
   <style type="text/css" media="all">
      
      body {
        --fg-color: #f1d7d4;
        --bg-color: #1f0d0b;
        color: var(--fg-color);
        background-color: var(--bg-color);
      }

      main {
        font-family: "Alfa Slab One", serif;
        font-weight: 400;
        font-style: normal;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20%;
        width: 50%;
        font-size: 45pt;
        justify: center;
        text-align: center;
      }

      @keyframes scroller-loop {
        0%: { top: -82%; }
        100% { top: -905%; }
      }

      @keyframes mobile-scroller-loop {
        0%: { top: -102%; }
        100% { top: -780%; }
      }

      .scroller {
        display: inline-block;
        visibility: visible;
        position: absolute;
        text-align: left;
        animation: 20s linear scroller-loop infinite;
        top: -82%;
        left: 0px;
      }

      .title {
        margin-bottom: 12%;
      }

      .text-entry {
        display: block;
      }

      .games {
        color: #ac141f;
      }

      .scroller-placeholder {
        visibility: hidden;
        position: relative;
      }

      a {
        text-decoration: none;
        color: var(--fg-color)
      }

      a:visited {
        color: var(--fg-color);
      }

      .scroller-masker {
        display: inline-block;
        visibility: visible;
        #background-color: #FF0000;
        position: absolute;
        left: 10px;
        width: 800px;
        height: 10rem;
        top: -20%; 
        mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
        overflow: hidden;
      }

      .social-link {
        font-size: 40px;
      }

      #watch {
        font-size: 40pt;
        font-style: italics;
      }

      @media (pointer:fine) {
        .scroller {
          animation: 20s linear scroller-loop infinite;
        }
      }

      @media (pointer:none), (pointer:coarse) {
        .scroller {
          animation: 20s linear mobile-scroller-loop infinite;
        }

        main {
          font-size: 30px !important;
          width: 90%;
        }

        a {
          font-size: 20px !important;
        }

        .title {
          font-size: 20px !important;
        }

        .scroller-masker {
          top: -1rem !important;
          height: 4rem !important;

        }
      }
   </style>
</head>

            <span class="text-entry">Freshness</span>
